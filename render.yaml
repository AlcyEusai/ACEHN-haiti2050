services:
  - type: web
    name: haiti2050-registry
    runtime: python
    plan: starter
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HAITI2050_DB
        value: /var/data/haiti2050.sqlite3
      - key: HAITI2050_ADMIN_TOKEN
        sync: false
      - key: HAITI2050_ALLOWED_ORIGINS
        sync: false
    disk:
      name: haiti2050-registry-data
      mountPath: /var/data
      sizeGB: 1
